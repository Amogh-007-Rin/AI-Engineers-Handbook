name: MLOps academy tests

on:
  pull_request:
    paths:
      - "Libraries/BentoML/**"
      - "Libraries/MLflow/**"
      - "Libraries/OpenAI SDK/**"
      - "Libraries/Weights & Biases/**"
      - ".github/workflows/mlops-academies.yml"
  push:
    paths:
      - "Libraries/BentoML/**"
      - "Libraries/MLflow/**"
      - "Libraries/OpenAI SDK/**"
      - "Libraries/Weights & Biases/**"
      - ".github/workflows/mlops-academies.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  academy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: "3.12", academy: "BentoML"}
          - {python: "3.12", academy: "MLflow"}
          - {python: "3.14", academy: "MLflow"}
          - {python: "3.12", academy: "OpenAI SDK"}
          - {python: "3.14", academy: "OpenAI SDK"}
          - {python: "3.12", academy: "Weights & Biases"}
          - {python: "3.14", academy: "Weights & Biases"}
    env:
      MLFLOW_DISABLE_AGENT_HINT: "1"
      MLFLOW_ENABLE_TELEMETRY: "false"
      WANDB_MODE: offline
      WANDB_SILENT: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install academy environment
        run: python -m pip install -r "Libraries/${{ matrix.academy }}/environment/requirements.txt"
      - name: Run native academy tests
        run: python -W error -m unittest discover -s "Libraries/${{ matrix.academy }}/projects" -v
