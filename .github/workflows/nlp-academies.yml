name: NLP academy smoke tests

on:
  push:
    paths:
      - "Libraries/NLTK/**"
      - "Libraries/spaCy/**"
      - "Libraries/Gensim/**"
      - ".github/workflows/nlp-academies.yml"
  pull_request:
    paths:
      - "Libraries/NLTK/**"
      - "Libraries/spaCy/**"
      - "Libraries/Gensim/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classical-nlp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        academy: [NLTK, spaCy, Gensim]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r "Libraries/${{ matrix.academy }}/environment/requirements.txt"
      - run: python -W error -m unittest discover -s "Libraries/${{ matrix.academy }}/projects" -v
