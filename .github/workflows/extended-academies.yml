name: Extended academy tests

on:
  pull_request:
    paths:
      - "Libraries/Albumentations/**"
      - "Libraries/Bokeh/**"
      - "Libraries/Dash/**"
      - "Libraries/Dask/**"
      - "Libraries/Gymnasium/**"
      - "Libraries/NetworkX/**"
      - "Libraries/OpenCV/**"
      - "Libraries/Plotly/**"
      - ".github/workflows/extended-academies.yml"
  push:
    paths:
      - "Libraries/Albumentations/**"
      - "Libraries/Bokeh/**"
      - "Libraries/Dash/**"
      - "Libraries/Dask/**"
      - "Libraries/Gymnasium/**"
      - "Libraries/NetworkX/**"
      - "Libraries/OpenCV/**"
      - "Libraries/Plotly/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  academy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        academy: [Albumentations, Bokeh, Dash, Dask, Gymnasium, NetworkX, OpenCV, Plotly]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install academy environment
        run: python -m pip install -r "Libraries/${{ matrix.academy }}/environment/requirements.txt"
      - name: Run academy tests
        run: python -W error -m unittest discover -s "Libraries/${{ matrix.academy }}/projects" -v
